name: setup-document
description: Sets up the document development environment
inputs: {}
outputs: {}
runs:
  using: composite
  steps:
    - uses: $/.github/actions/setup
    - uses: pnpm/action-setup@v6.1.1
      with:
        package_json_file: doc/package.json
    - uses: actions/setup-node@v7.1.0
      with:
        cache: pnpm
        cache-dependency-path: doc/pnpm-lock.yaml
        node-version-file: doc/package.json
    - run: pnpm i --frozen-lockfile
      working-directory: doc
      shell: bash
