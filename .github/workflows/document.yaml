name: document
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: document-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  rust_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: $/.github/actions/setup
      - run: cargo +nightly doc --all-features
  web_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          submodules: true
      - uses: actions/configure-pages@v6.0.0
      - uses: $/.github/actions/setup-document
      - run: node --run build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: doc/dist
      - uses: actions/deploy-pages@v5.0.1
        if: github.ref == 'refs/heads/main'
  web_lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-document
      - run: node --run lint
  web_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          submodules: true
      - uses: $/.github/actions/setup-document
      - uses: $/.github/actions/muffy-cache
      - run: node --run build -- --site http://localhost:4321
      - run: node --run preview &
      - run: cargo run check ../muffy.local.toml
  document:
    needs:
      - rust_build
      - web_build
      - web_lint
      - web_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
